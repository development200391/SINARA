version: '3.9'

services:

  erp-redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - erp_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  erp-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: erp_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Host=host.docker.internal;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: "erp-redis:6379,password=${REDIS_PASSWORD}"
      Redis__InstanceName: "ERP_"
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      JwtSettings__RefreshTokenExpiryDays: ${REFRESH_TOKEN_EXPIRY_DAYS}
      JwtSettings__SigningKey: ${JWT_SIGNING_KEY:-ChangeMe_SigningKey_AtLeast_32_Chars_Long_12345}
    depends_on:
      erp-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    networks:
      - erp_network

  erp-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: erp_web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ApiSettings__BaseUrl: "http://erp-api:8080"
      Redis__ConnectionString: "erp-redis:6379,password=${REDIS_PASSWORD}"
      Redis__InstanceName: "ERP_"
    depends_on:
      - erp-api
    ports:
      - "8080:8080"
    networks:
      - erp_network

volumes:
  redis_data:

networks:
  erp_network:
    driver: bridge

